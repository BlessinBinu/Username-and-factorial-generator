<!DOCTYPE html>
<html lang="en">
    <head>
        <title>MyFunctions</title>
    </head>

    <body>
        <script>
            
            function string_function(name) // Declares the string function recieving the user's name
            {
                function create_name(user) // Generates a username using the user's first initial  and last name (in lowercase)
                {
                
                    let names = user.split(" "); // splits the user into a string
                    let string1 = names[0]; // set the first string to names[0]
                    let string2 = names[1]; // set the second string to names[1]

                    let userName = (string1.charAt().toUpperCase() + string2); // concatenate the first character of string1 with string2 and store in userName
                    return userName; // returns the generated username
                }
                return create_name(name); // returns the result of create_name(name)
            }
        
            function number_function() // Declares the function for calculating factorials
            {
                let number = ""; // initialise variable
                
                do  // begins loop to ensure a positive number is entered
                {
                    let input = prompt("Enter a positive whole number greater than 0"); // asks the user for a positive whole number

                    if (input === null) return; // Exit if user clicks cancel

                    number = parseFloat(input); // converts input string to an integer

                    if (number < 1 || isNaN(number)) // checks if the number is less than 1 or is not a valid number
                    {
                        window.alert("Enter a positive whole number greater than 0"); // asks the user again to enter a valid positive whole number greater than 0
                    }
                
                } while (number < 1 || isNaN(number)); // loops again if the input is invalid
                
                let counter = number; // initializes the counter to the number
                let factorial = 1; // initialize the factorial result from 1
                let calculationString = ""; // initializes the string to store the expanded format of the arithmetic

                while (counter > 0) // loops for when the counter is greater than 0
                {
                    factorial = factorial * counter; // calcualtes the factorial by multiplying itself with the user entered counter

                    if (counter !== 1) // checks if the counter is not equal to 1
                    {
                        calculationString += counter + " * " ; // prints the counter value and formats with multiplication
                    } else // this only runs in the final part when the counter drops down to 1
                    {
                        calculationString += counter; // prints the counter and formats with equals so that the multiplication (*) does not continue on
                    }

                    counter--; // Decrements the counter by 1 till 0 so that it prevents an infinite loop
                } // ends the loop once the counter reaches 0

                window.alert("The factorial of " + number + " is" + " " + calculationString + " = " + factorial); // displays the final alert showing the input number, the calculation string and the calculated value of the factorial
            }

            function Menu() // Declares the main menu function
            {
                let name = prompt("Enter your full name"); // asks the name of the user
                let choice = ""; // declares the variable to hold the user menu selection choice

                if (!name || name.trim() === "") // checks if the input is invalid or empty
                {
                    name = "User"; // provides a default of "User" if input was blank or invalid
                }

                do // begins the loop so that the menu for the options keeps looping back until the user chooses to quit the menu
                {
                    let inputChoice = prompt("Welcome " + name + "!\n\n" + "MyFunctions Menu:\n" + "1. Generate Username\n" + "2. Calculate Factorial\n" + "3. Quit\n\n" + "Enter your choice (1-3):"); // asks the user for a menu choice and holds the string input

                    if (inputChoice === null) // checks if the user clicked cancel on menu prompt
                    {
                        choice = 3; // sets the choice to quit so it triggers the exit condition
                        break; // breaks out of the menu loop if the conditions for this statement is met
                    }

                    choice = parseInt(inputChoice, 10); // converts the menu choice string into an integer with a base of 10

                    switch (choice) // checks each of the choices available that the user has chosen
                    {
                        case 1: // handles the 1st option in the menu
                            window.alert(name + " - This is option 1"); // displays a confirmation that you have chosen option 1

                            let generatedUser = string_function(name); // calls the string_function passing user's name
                            window.alert("Generated Username: " + generatedUser); // displays the generated username
                            break; // exits case 1

                        case 2: // handles the 2nd option in the menu
                            window.alert(name + " - This is option 2"); // displays confirmation that you have chosen option 2
                            number_function(); // starts the number_function to calculate the factorial
                            break; // exits case 2

                        case 3: // handles the 3rd option in the menu
                            window.alert("Goodbye " + name); // displays goodbye message with the user's name
                            break; // exits case 3

                        default: // handles any invalid user choice thats not 1-3
                            window.alert("Choice between 1 and 3 only - try again"); // asks the user to choose again from the options (1-3)
                            break; // exits default block
                    }
                } while (choice !== 3); // loops back when the choice is not equal to 3
            }

            Menu(); // runs the main menu function

        </script>
    </body>

</html>
